# Local WordPress + WooCommerce backend for the Dewlune storefront.
# Start it with ./setup.sh (first run installs WordPress, WooCommerce and the catalog).

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # One-off WP-CLI container sharing the WordPress files, used by setup.sh.
  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./seed:/seed:ro
      - ../web/src/data:/catalog:ro

volumes:
  db:
  wp:
